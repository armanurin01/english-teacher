/* Режим скриншота: расписание целиком на экране, без изменения основной темы */
body.schedule-capture .side,
body.schedule-capture .topbar,
body.schedule-capture .section-title,
body.schedule-capture .calendar-tools button,
body.schedule-capture .cardhead .toolbar,
body.schedule-capture .capture-hide {display:none!important}
body.schedule-capture .app{display:block!important;min-height:100vh}
body.schedule-capture main{padding:8px!important;max-width:none!important;width:100%!important}
body.schedule-capture .page{max-width:none!important;margin:0!important}
body.schedule-capture .card{padding:8px!important;margin:0!important;border-radius:14px}
body.schedule-capture .cardhead{padding:2px 4px 6px!important;min-height:0}
body.schedule-capture .calendar{grid-template-columns:48px repeat(7,minmax(0,1fr));width:100%;overflow:hidden;border-radius:10px}
body.schedule-capture .calhead{min-width:0;padding:5px 2px;font-size:12px}
body.schedule-capture .calday{font-size:14px}
body.schedule-capture .hour,body.schedule-capture .slot{height:22px}
body.schedule-capture .hour{font-size:12px;padding:2px 1px}
body.schedule-capture .slot{min-width:0;padding:1px}
body.schedule-capture .lesson{height:calc(var(--duration-slots)*22px - 3px)!important;min-height:18px;top:1px;left:1px;right:1px;padding:3px 3px;font-size:9px;border-radius:6px}
body.schedule-capture .lesson b{font-size:9px;line-height:1.15}
body.schedule-capture .lesson-student{font-size:9px;line-height:1.15}
body.schedule-capture .page .card>div:last-child{margin-top:5px!important;font-size:10px!important}
body.schedule-capture .calendar-tools{justify-content:center}
body.schedule-capture .weeklabel{font-size:14px;font-weight:700}
@media print{
  body.schedule-capture{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.schedule-capture .calendar{overflow:visible}
  body.schedule-capture main{padding:0!important}
}

15px}.picker-time.selected{font-weight:750;outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}.picker-time:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.picker-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.picker-foot button{border-radius:11px;padding:10px 14px}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">✿</div><div><strong id="studioBrandName">Bloom English</strong><small>teacher's space</small></div></div><div class="navlabel">Мой кабинет</div><nav class="nav" id="nav"><button class="active" data-page="home"><span class="ico">⌂</span>Обзор</button><button data-page="schedule"><span class="ico">▦</span>Расписание</button><button data-page="students"><span class="ico">♡</span>Студенты</button><button data-page="payments"><span class="ico">₽</span>Оплаты</button><button data-page="income"><span class="ico">↗</span>Доход</button><button data-page="settings"><span class="ico">⚙</span>Настройки</button></nav><div class="sidebottom"><div class="profile"><div class="mini-avatar">🌷</div><div><strong>Мой кабинет</strong><small>English tutor</small></div></div></div></aside><main><header class="topbar"><div><div class="eyebrow" id="todayLabel">ТВОЁ ПРОСТРАНСТВО</div><h1 id="pageTitle">Добро пожаловать ✨</h1></div><div class="top-actions"><span class="pill" id="topDate">♡ Учим с любовью</span><button class="primary" onclick="openLessonModal()">＋ Занятие</button></div></header><div id="content"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);const today=new Date();const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const parseDate=s=>new Date(s+'T12:00:00');const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:(data?.settings?.currency||'RUB'),maximumFractionDigits:0}).format(Number(n)||0);const dayNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const monthNames=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];const monthLong=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const defaults={students:[{id:1,name:'Алиса Морозова',level:'B1 · Intermediate',type:'individual',price:1800,contact:'',active:true},{id:2,name:'Маша и Лиза',level:'A2 · Elementary',type:'pair',price:1200,contact:'',active:true},{id:3,name:'София Волкова',level:'A1 · Beginner',type:'individual',price:1800,contact:'',active:true}],lessons:[],payments:[],settings:{priceIndividual:1800,pricePair:1200,workStart:8,workEnd:21,theme:'pink',opacity:76,teacher:'Моя студия английского',currency:'RUB'}};
let data;try{data=JSON.parse(localStorage.getItem('bloomEnglishData'))||structuredClone(defaults)}catch{data=structuredClone(defaults)};data.students ||= [];data.lessons ||= [];data.payments ||= [];data.settings={...defaults.settings,...data.settings};let page='home',calDate=new Date(today),calView='week',showFree=false,studentSearch='',paymentFilter='all';
// Seed a few appointments for the current week on first use.
if(!localStorage.getItem('bloomEnglishData')){const monday=weekStart(today);data.lessons=[{id:1,studentId:1,date:iso(addDays(monday,0)),time:'10:00',duration:60,type:'individual',status:'planned',note:''},{id:2,studentId:2,date:iso(addDays(monday,1)),time:'16:00',duration:60,type:'pair',status:'planned',note:''},{id:3,studentId:3,date:iso(addDays(monday,3)),time:'12:00',duration:60,type:'individual',status:'planned',note:''}];}
function save(){localStorage.setItem('bloomEnglishData',JSON.stringify(data))}function weekStart(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function fmtShort(d){return `${d.getDate()} ${monthNames[d.getMonth()]}`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function student(id){return data.students.find(s=>s.id==id)}function lessonStudent(l){return student(l.studentId)?.name||'Студент удалён'}function typeName(t){return t==='pair'?'Парное':'Индивидуальное'}function lessonPrice(l){const s=student(l.studentId);return Number(s?.price??(l.type==='pair'?data.settings.pricePair:data.settings.priceIndividual))}function monthLessons(date=today){return data.lessons.filter(l=>l.date.slice(0,7)===iso(date).slice(0,7))}function monthPayments(date=today){return data.payments.filter(p=>p.date.slice(0,7)===iso(date).slice(0,7))}function earned(lessons){return lessons.filter(l=>l.status==='done').reduce((sum,l)=>sum+lessonPrice(l),0)}function paidFor(l){return data.payments.filter(p=>p.lessonId===l.id).reduce((a,p)=>a+Number(p.amount),0)}function pendingAmount(l){return Math.max(0,lessonPrice(l)-paidFor(l))}function studentBalance(s){const paid=data.payments.filter(p=>{const l=data.lessons.find(x=>x.id===p.lessonId);return l&&Number(l.studentId)===Number(s.id)}).reduce((n,p)=>n+Number(p.amount||0),0);const consumed=data.lessons.filter(l=>Number(l.studentId)===Number(s.id)&&l.status==='done').reduce((n,l)=>n+lessonPrice(l),0);const credit=Math.max(0,paid-consumed);const price=Number(s.price|| (s.type==='pair'?data.settings.pricePair:data.settings.priceIndividual))||1;return {paid,consumed,credit,lessons:Math.floor(credit/price),remainder:credit%price,price}}function showToast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
const titles={home:'Добро пожаловать ✨',schedule:'Моё расписание',students:'Мои студенты',payments:'Оплаты и расчёты',income:'Мой доход',settings:'Настройки кабинета'};function navigate(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=titles[p];render();window.scrollTo({top:0,behavior:'smooth'})}$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});$('#todayLabel').textContent=today.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});$('#topDate').textContent='♡ Учим с любовью';
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('schedule-capture'))toggleCaptureMode()});
function toggleCaptureMode(){document.body.classList.toggle('schedule-capture');const b=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('Скриншот на весь экран')||x.textContent.includes('Обычный вид'));if(b)b.textContent=document.body.classList.contains('schedule-capture')?'↙ Обычный вид':'⛶ Скриншот на весь экран'}
function render(){const root=$('#content');root.innerHTML=`<div class="page">${({home:homePage,schedule:schedulePage,students:studentsPage,payments:paymentsPage,income:incomePage,settings:settingsPage})[page]()}</div>`;applySettings()}
function homePage(){const todayLessons=data.lessons.filter(l=>l.date===iso(today)).sort((a,b)=>a.time.localeCompare(b.time));const active=data.students.filter(s=>s.active!==false).length;const done=monthLessons().filter(l=>l.status==='done').length;const paid=monthPayments().reduce((s,p)=>s+Number(p.amount),0);const planned=monthLessons().filter(l=>l.status!=='cancelled').length;return `<section class="welcome"><div><div class="eyebrow">ТВОЯ МАЛЕНЬКАЯ ENGLISH-ВСЕЛЕННАЯ</div><h2>Каждый урок — маленький успех 🌷</h2><p>Пусть твой день будет лёгким, а ученики — вдохновлёнными.</p></div><button class="primary" onclick="navigate('schedule')">Открыть расписание ↗</button></section><section class="stats"><div class="stat"><div class="stathead">Активные студенты <span class="stat-icon">♡</span></div><strong>${active}</strong><small>в твоём кабинете</small></div><div class="stat"><div class="stathead">Проведено в этом месяце <span class="stat-icon">✎</span></div><strong>${done}</strong><small>из ${planned} запланированных</small></div><div class="stat"><div class="stathead">Доход за месяц <span class="stat-icon">↗</span></div><strong>${money(earned(monthLessons()))}</strong><small>за проведённые уроки</small></div><div class="stat"><div class="stathead">Получено оплат <span class="stat-icon">♡</span></div><strong>${money(paid)}</strong><small>за текущий месяц</small></div></section><div class="columns"><section class="card"><div class="cardhead"><h3>Ближайшие занятия</h3><button class="ghost" onclick="navigate('schedule')">Все занятия ↗</button></div>${upcomingLessons().length?upcomingLessons().map(l=>eventHTML(l)).join(''):`<div class="empty">Пока нет ближайших занятий.<br><button class="primary" style="margin-top:12px" onclick="openLessonModal()">＋ Добавить занятие</button></div>`}</section><section class="card"><div class="cardhead"><h3>Быстрые действия</h3><span>✿</span></div><div class="event"><div class="stat-icon">♡</div><div class="eventinfo"><strong>Новый студент</strong><small>Добавь ученика в свой список</small></div><button class="ghost" onclick="openStudentModal()">＋</button></div><div class="event"><div class="stat-icon">▦</div><div class="eventinfo"><strong>Запланировать урок</strong><small>Индивидуальный или парный</small></div><button class="ghost" onclick="openLessonModal()">＋</button></div><div class="event"><div class="stat-icon">₽</div><div class="eventinfo"><strong>Записать оплату</strong><small>Обнови расчёты со студентом</small></div><button class="ghost" onclick="navigate('payments')">↗</button></div><div style="margin-top:20px;padding:15px;border-radius:16px;background:var(--accent2)"><div class="eyebrow">МАЛЕНЬКИЙ ШАГ</div><strong style="display:block;margin:5px 0">Ты создаёшь большое 💗</strong><span class="muted">Стабильность складывается из маленьких привычек.</span></div></section></div>`}
function upcomingLessons(){return data.lessons.filter(l=>l.date>=iso(today)&&l.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5)}function eventHTML(l){return `<div class="event"><div class="time">${esc(l.time)}<br><small>${fmtShort(parseDate(l.date))}</small></div><div class="eventline ${l.type==='pair'?'pair':''}"></div><div class="eventinfo"><strong>${esc(lessonStudent(l))}</strong><small>${typeName(l.type)} · ${l.duration||60} мин</small></div><span class="tag ${l.type==='pair'?'pair':''}">${l.status==='done'?'Проведено':l.status==='cancelled'?'Отменено':'Запланировано'}</span><button class="ghost" onclick="openLessonModal(${l.id})">···</button></div>`}
function schedulePage(){const start=weekStart(calDate),end=addDays(start,6),heading=calView==='week'?`${fmtShort(start)} — ${fmtShort(end)} ${end.getFullYear()}`:`${monthLong[calDate.getMonth()]} ${calDate.getFullYear()}`;return `<div class="section-title"><div><div class="eyebrow">ПЛАНИРУЙ БЕРЕЖНО</div><h2>Расписание</h2><div class="muted">Все твои уроки в одном месте</div></div><div class="toolbar"><button class="ghost" onclick="toggleCaptureMode()">⛶ Скриншот на весь экран</button><button class="primary" onclick="openLessonModal()">＋ Занятие</button></div></div><section class="card"><div class="cardhead"><div class="calendar-tools"><button class="ghost" onclick="shiftCalendar(-1)">←</button><button class="ghost" onclick="calDate=new Date(today);render()">Сегодня</button><button class="ghost" onclick="shiftCalendar(1)">→</button><span class="weeklabel">${heading}</span></div><div class="toolbar"><button class="ghost" onclick="setCalView('week')" style="${calView==='week'?'background:var(--accent2)':''}">Неделя</button><button class="ghost" onclick="setCalView('month')" style="${calView==='month'?'background:var(--accent2)':''}">Месяц</button></div></div><div class="toolbar" style="margin-bottom:16px"><button class="ghost" onclick="showFree=!showFree;render()">${showFree?'✓ ':'＋ '}${showFree?'Скрыть свободные слоты':'Показать свободные слоты'}</button><span class="muted" style="font-size:12px">Перетаскивай занятия мышкой на другой день и время · шаг сетки 30 минут</span></div>${calView==='week'?weekCalendar(start):monthCalendar(calDate)}<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)"><span>🩷 Индивидуальное занятие</span><span>💜 Парное занятие</span><span>◌ Свободный слот</span></div></section>${showFree?freeSlotsSection(start,end):''}`}
function setCalView(v){calView=v;render()}function shiftCalendar(n){calDate=calView==='week'?addDays(calDate,n*7):new Date(calDate.getFullYear(),calDate.getMonth()+n,1);render()}
let draggedLessonId=null;
function startLessonDrag(e,id){draggedLessonId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));e.currentTarget.classList.add('dragging')}
function endLessonDrag(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'))}
function allowLessonDrop(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop-target')}
function leaveLessonDrop(e){e.currentTarget.classList.remove('drop-target')}
function dropLesson(e,date,time){e.preventDefault();e.currentTarget.classList.remove('drop-target');const id=Number(e.dataTransfer.getData('text/plain')||draggedLessonId);const lesson=data.lessons.find(x=>x.id===id);if(!lesson)return;const conflict=data.lessons.find(x=>x.id!==id&&x.date===date&&x.time===time&&x.status!=='cancelled');if(conflict){showToast('В это время уже есть занятие. Выбери другой слот ✿');return}lesson.date=date;lesson.time=time;save();render();showToast(`Занятие перенесено на ${fmtShort(parseDate(date))}, ${time} ✿`);draggedLessonId=null}
function weekCalendar(start){let html='<div class="calendar"><div class="calhead">Время</div>';for(let i=0;i<7;i++){let d=addDays(start,i);html+=`<div class="calhead ${iso(d)===iso(today)?'today':''}">${dayNames[i]}<span class="calday">${d.getDate()}</span></div>`}for(let mins=Number(data.settings.workStart??8)*60;mins<Number(data.settings.workEnd??21)*60;mins+=30){let h=Math.floor(mins/60),m=mins%60,time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');html+=`<div class="hour ${m===30?'half-hour':''}">${m===0?String(h).padStart(2,'0')+':00':''}</div>`;for(let i=0;i<7;i++){let d=addDays(start,i),date=iso(d),ls=data.lessons.filter(l=>l.date===date&&l.time===time&&l.status!=='cancelled');let free=showFree&&!ls.length&&h>=Number(data.settings.workStart??8)&&h<Number(data.settings.workEnd??21);html+=`<div class="slot ${m===30?'half-hour':''}" data-date="${date}" data-time="${time}" ondragover="allowLessonDrop(event)" ondragleave="leaveLessonDrop(event)" ondrop="dropLesson(event,'${date}','${time}')" onclick="if(event.target===this&&${free})openLessonModal(null,'${date}','${time}')">${ls.map(l=>{const duration=Number(l.duration)||60;const startMins=Number(l.time.slice(0,2))*60+Number(l.time.slice(3,5));const endMins=startMins+duration;const endTime=String(Math.floor(endMins/60)).padStart(2,'0')+':'+String(endMins%60).padStart(2,'0');return `<div class="lesson ${l.type==='pair'?'pair':''} ${l.status==='done'?'done':l.status==='cancelled'?'cancelled':''}" style="--duration-slots:${duration/30};--lesson-height:${Math.max(30,duration/30*34-4)}px" draggable="true" ondragstart="startLessonDrag(event,${l.id})" ondragend="endLessonDrag(event)" onclick="event.stopPropagation();openLessonModal(${l.id})" title="${esc(l.time)}–${endTime} · ${duration} минут. Перетащи, чтобы перенести занятие"><b>${esc(l.time)}–${endTime}</b><span class="lesson-student">${esc(lessonStudent(l))}</span></div>`}).join('')}${free?`<button onclick="event.stopPropagation();openLessonModal(null,'${date}','${time}')" style="width:100%;height:100%;border:1px dashed var(--accent);border-radius:6px;background:transparent;color:var(--muted);font-size:10px">＋</button>`:''}</div>`}}return html+'</div>'}
function monthCalendar(date){const first=new Date(date.getFullYear(),date.getMonth(),1),offset=(first.getDay()+6)%7,days=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();let html='<div class="monthgrid">'+dayNames.map(d=>`<div class="calhead">${d}</div>`).join('');for(let i=0;i<42;i++){let n=i-offset+1,d=new Date(date.getFullYear(),date.getMonth(),n),inMonth=n>0&&n<=days,ds=iso(d),ls=data.lessons.filter(l=>l.date===ds&&l.status!=='cancelled');html+=`<div class="monthcell ${inMonth?'':'dim'} ${ds===iso(today)?'today':''}"><div class="monthnum">${d.getDate()}</div>${ls.slice(0,3).map(l=>`<div class="monthlesson" onclick="openLessonModal(${l.id})" title="${esc(lessonStudent(l))}">${esc(l.time)} ${esc(lessonStudent(l).split(' ')[0])}</div>`).join('')}${ls.length>3?`<small>+${ls.length-3} ещё</small>`:''}${showFree&&inMonth?`<button onclick="openLessonModal(null,'${ds}','10:00')" style="margin-top:4px;background:transparent;color:var(--muted);font-size:10px">＋</button>`:''}</div>`}return html+'</div>'}function freeSlotsSection(start,end){let days=[];for(let d=new Date(start);d<=end;d=addDays(d,1))days.push(new Date(d));let rows=[];for(const d of days)for(let h=9;h<19;h++){const date=iso(d),time=String(h).padStart(2,'0')+':00';if(!data.lessons.some(l=>l.date===date&&l.time===time&&l.status!=='cancelled'))rows.push({date,time})}return `<section class="card" style="margin-top:18px"><div class="cardhead"><h3>Свободные слоты</h3><span class="tag">${rows.length} доступно</span></div><p class="muted">Свободное время с 09:00 до 19:00 без учёта длительности урока. Нажми, чтобы создать занятие.</p>${rows.length?`<div class="grid2">${rows.map(r=>`<button class="ghost" style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px" onclick="openLessonModal(null,'${r.date}','${r.time}')"><span>${dayNames[(parseDate(r.date).getDay()+6)%7]}, ${fmtShort(parseDate(r.date))}</span><strong>${r.time}</strong><span>＋</span></button>`).join('')}</div>`:'<div class="empty">На этой неделе свободных слотов не найдено.</div>'}</section>`}
function studentsPage(){let arr=data.students.filter(s=>(s.name+' '+s.level).toLowerCase().includes(studentSearch.toLowerCase()));return `<div class="section-title"><div><div class="eyebrow">ТВОЯ КОМАНДА</div><h2>Студенты</h2><div class="muted">Индивидуальные ученики и пары</div></div><button class="primary" onclick="openStudentModal()">＋ Добавить студента</button></div><div class="stats"><div class="stat"><div class="stathead">Всего учеников</div><strong>${data.students.length}</strong><small>включая парные группы</small></div><div class="stat"><div class="stathead">Индивидуально</div><strong>${data.students.filter(s=>s.type==='individual').length}</strong><small>учеников / групп</small></div><div class="stat"><div class="stathead">Парные занятия</div><strong>${data.students.filter(s=>s.type==='pair').length}</strong><small>пар / групп</small></div><div class="stat"><div class="stathead">Активные</div><strong>${data.students.filter(s=>s.active!==false).length}</strong><small>сейчас занимаются</small></div></div><section class="card"><div class="cardhead"><h3>Список студентов</h3><input class="search" placeholder="Поиск по имени…" value="${esc(studentSearch)}" oninput="studentSearch=this.value;const pos=this.selectionStart;render();const el=$('.search');el.focus();el.setSelectionRange(pos,pos)"></div><div class="tablewrap"><table><thead><tr><th>Студент / пара</th><th>Уровень</th><th>Формат</th><th>Цена за урок</th><th>Баланс уроков</th><th>Статус</th><th></th></tr></thead><tbody>${arr.map(s=>`<tr><td><div class="studentname"><div class="avatar ${s.type==='pair'?'purple':''}">${s.type==='pair'?'♧':'♡'}</div><div>${esc(s.name)}<div class="muted" style="font-size:11px;font-weight:400">${esc(s.contact||'')}</div></div></div></td><td>${esc(s.level||'—')}</td><td><span class="tag ${s.type==='pair'?'pair':''}">${typeName(s.type)}</span></td><td>${money(s.price)}</td><td><strong>${studentBalance(s).lessons} урок.</strong><div class="muted" style="font-size:11px">${money(studentBalance(s).credit)} на балансе</div></td><td><span class="status ${s.active===false?'pending':''}">${s.active===false?'Неактивен':'Активен'}</span></td><td><button class="ghost" onclick="openStudentModal(${s.id})">Изменить</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Студентов пока нет. Добавь первого ученика ✿</div></td></tr>'}</tbody></table></div></section>`}
function paymentsPage(){let lessons=[...data.lessons].filter(l=>l.status!=='cancelled').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));if(paymentFilter==='pending')lessons=lessons.filter(l=>pendingAmount(l)>0);if(paymentFilter==='paid')lessons=lessons.filter(l=>pendingAmount(l)===0);const paid=monthPayments().reduce((s,p)=>s+Number(p.amount),0),due=lessons.reduce((s,l)=>s+pendingAmount(l),0);return `<div class="section-title"><div><div class="eyebrow">ФИНАНСЫ БЕЗ СТРЕССА</div><h2>Оплаты</h2><div class="muted">Веди учёт оплат по каждому занятию</div></div><button class="primary" onclick="openPaymentModal()">＋ Записать оплату</button></div><div class="stats"><div class="stat"><div class="stathead">Получено в этом месяце</div><strong>${money(paid)}</strong><small>по внесённым оплатам</small></div><div class="stat"><div class="stathead">Ожидает оплаты</div><strong>${money(due)}</strong><small>по занятиям в списке</small></div><div class="stat"><div class="stathead">Оплаченных уроков</div><strong>${lessons.filter(l=>pendingAmount(l)===0).length}</strong><small>полностью закрыто</small></div><div class="stat"><div class="stathead">Нужна оплата</div><strong>${lessons.filter(l=>pendingAmount(l)>0).length}</strong><small>полностью или частично</small></div></div><section class="card" style="margin-bottom:18px"><div class="cardhead"><h3>Баланс занятий по студентам</h3><span class="muted" style="font-size:12px">Оплачено минус проведённые уроки</span></div><div class="tablewrap"><table><thead><tr><th>Студент</th><th>Всего оплачено</th><th>Проведено на сумму</th><th>Остаток на балансе</th><th>Уроков осталось</th></tr></thead><tbody>${data.students.map(s=>{const b=studentBalance(s);return `<tr><td><strong>${esc(s.name)}</strong></td><td>${money(b.paid)}</td><td>${money(b.consumed)}</td><td>${money(b.credit)}</td><td><span class="status">${b.lessons} урок.</span></td></tr>`}).join('')||'<tr><td colspan="5">Добавь студента, чтобы видеть баланс.</td></tr>'}</tbody></table></div><p class="muted" style="font-size:12px">Например: оплата 6 000 ₽ при цене урока 2 000 ₽ даёт 3 урока. После одного проведённого урока останется 2.</p></section><section class="card"><div class="cardhead"><h3>Оплаты по занятиям</h3><select class="search" onchange="paymentFilter=this.value;render()"><option value="all" ${paymentFilter==='all'?'selected':''}>Все занятия</option><option value="pending" ${paymentFilter==='pending'?'selected':''}>Есть долг</option><option value="paid" ${paymentFilter==='paid'?'selected':''}>Оплачено полностью</option></select></div><div class="tablewrap"><table><thead><tr><th>Дата</th><th>Студент</th><th>Стоимость</th><th>Оплачено</th><th>Остаток</th><th>Статус</th><th></th></tr></thead><tbody>${lessons.map(l=>{let paid=paidFor(l),left=pendingAmount(l);return `<tr><td>${fmtShort(parseDate(l.date))}<div class="muted">${l.time}</div></td><td><strong>${esc(lessonStudent(l))}</strong><div class="muted">${typeName(l.type)}</div></td><td>${money(lessonPrice(l))}</td><td>${money(paid)}</td><td>${money(left)}</td><td><span class="status ${left?'pending':''}">${left===0?'Оплачено':paid?'Частично':'Ожидает'}</span></td><td><button class="ghost" onclick="openPaymentModal(${l.id})">${left?'Внести':'История'}</button></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">Здесь появятся занятия. Сначала добавь урок в расписание.</div></td></tr>'}</tbody></table></div><p class="muted" style="font-size:12px;margin-bottom:0">Сумма оплаты записывается вручную. Для учёта дохода занятие нужно отметить как проведённое в расписании.</p></section>`}
function incomePage(){const month=monthLessons(),done=month.filter(l=>l.status==='done'),paid=monthPayments().reduce((s,p)=>s+Number(p.amount),0);let week=weekStart(today),day=iso(today),weekLs=data.lessons.filter(l=>l.date>=iso(week)&&l.date<=iso(addDays(week,6)));const dayIncome=earned(data.lessons.filter(l=>l.date===day)),weekIncome=earned(weekLs),monthIncome=earned(month);let days=[];for(let i=0;i<7;i++){let d=addDays(week,i),sum=earned(data.lessons.filter(l=>l.date===iso(d)));days.push({label:dayNames[i],sum})}let max=Math.max(1,...days.map(x=>x.sum));return `<div class="section-title"><div><div class="eyebrow">ТВОЙ ТРУД И РОСТ</div><h2>Доход</h2><div class="muted">Статистика по проведённым занятиям</div></div><span class="pill">${monthLong[today.getMonth()]} ${today.getFullYear()}</span></div><div class="stats"><div class="stat"><div class="stathead">Сегодня</div><strong>${money(dayIncome)}</strong><small>проведённые уроки</small></div><div class="stat"><div class="stathead">За неделю</div><strong>${money(weekIncome)}</strong><small>с понедельника по воскресенье</small></div><div class="stat"><div class="stathead">За месяц</div><strong>${money(monthIncome)}</strong><small>${done.length} проведено занятий</small></div><div class="stat"><div class="stathead">Фактически получено</div><strong>${money(paid)}</strong><small>оплаты за этот месяц</small></div></div><div class="columns"><section class="card"><div class="cardhead"><h3>Доход за текущую неделю</h3><span class="tag">${money(weekIncome)}</span></div>${days.map(d=>`<div class="barrow"><span>${d.label}</span><div class="barbg"><div class="barfill" style="width:${d.sum/max*100}%"></div></div><strong style="text-align:right">${money(d.sum)}</strong></div>`).join('')}<p class="muted" style="font-size:12px;margin-bottom:0">Расчётный доход учитывает стоимость проведённых уроков, а не факт получения оплаты.</p></section><section class="card"><div class="cardhead"><h3>Статистика месяца</h3><span>✿</span></div><div class="eyebrow">ПРОВЕДЕНО УРОКОВ</div><div class="revenuebig">${done.length}</div><div class="muted">из ${month.filter(l=>l.status!=='cancelled').length} запланированных</div><div class="settingrow"><div><strong>Индивидуальных</strong><small>проведённые уроки</small></div><strong>${done.filter(l=>l.type==='individual').length}</strong></div><div class="settingrow"><div><strong>Парных</strong><small>проведённые уроки</small></div><strong>${done.filter(l=>l.type==='pair').length}</strong></div><div class="settingrow"><div><strong>Осталось получить</strong><small>по занятиям месяца</small></div><strong>${money(month.filter(l=>l.status==='done').reduce((s,l)=>s+pendingAmount(l),0))}</strong></div><button class="primary" style="width:100%;margin-top:16px" onclick="navigate('payments')">Перейти к оплатам ↗</button></section></div>`}
function settingsPage(){const s=data.settings;return `<div class="section-title"><div><div class="eyebrow">СДЕЛАЙ ПО-СВОЕМУ</div><h2>Настройки</h2><div class="muted">Настрой рабочие часы, цены и внешний вид кабинета</div></div><button class="primary" onclick="saveSettings()">Сохранить изменения</button></div><div class="grid2"><section class="card"><div class="cardhead"><h3>Рабочее время</h3><span>◷</span></div><p class="muted" style="font-size:12px;margin-top:0">Эти часы определяют верхнюю и нижнюю границы временной сетки в недельном расписании.</p><div class="grid2"><div class="field"><label>Начало рабочего дня</label><select id="workStart">${Array.from({length:24},(_,h)=>`<option value="${h}" ${Number(s.workStart??8)===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></div><div class="field"><label>Конец рабочего дня</label><select id="workEnd">${Array.from({length:24},(_,h)=>`<option value="${h}" ${Number(s.workEnd??21)===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></div></div><p class="muted" style="font-size:12px">Можно выбрать, например, 09:00–18:00. Сетка отображает интервалы по 30 минут.</p></section><section class="card"><div class="cardhead"><h3>Стоимость занятий</h3><span>₽</span></div><div class="field"><label>Цена индивидуального урока (₽)</label><input id="priceIndividual" type="number" min="0" step="50" value="${s.priceIndividual}"></div><div class="field"><label>Цена парного урока — с одного студента (₽)</label><input id="pricePair" type="number" min="0" step="50" value="${s.pricePair}"></div><p class="muted" style="font-size:12px">Новая цена применяется к новым студентам. У существующих студентов можно отредактировать цену в их карточке.</p></section><section class="card"><div class="cardhead"><h3>Оформление</h3><span>✿</span></div><div class="settingrow"><div><strong>Цветовая тема</strong><small>Выбери настроение</small></div><div class="swatches"><button class="swatch ${s.theme==='pink'?'selected':''}" style="background:#c99eb5" title="Розовая" onclick="setTheme('pink')"></button><button class="swatch ${s.theme==='sage'?'selected':''}" style="background:#a6bda7" title="Шалфей" onclick="setTheme('sage')"></button><button class="swatch ${s.theme==='lavender'?'selected':''}" style="background:#aaa3d2" title="Лаванда" onclick="setTheme('lavender')"></button><button class="swatch ${s.theme==='peach'?'selected':''}" style="background:#d8a78d" title="Персик" onclick="setTheme('peach')"></button><button class="swatch ${s.theme==='night'?'selected':''}" style="background:#373342" title="Вечерняя" onclick="setTheme('night')"></button><button class="swatch ${s.theme==='blue'?'selected':''}" style="background:#8db8ce" title="Голубая" onclick="setTheme('blue')"></button><button class="swatch ${s.theme==='butter'?'selected':''}" style="background:#d7c57e" title="Ванильная" onclick="setTheme('butter')"></button><button class="swatch ${s.theme==='mint'?'selected':''}" style="background:#91c4b0" title="Мятная" onclick="setTheme('mint')"></button><button class="swatch ${s.theme==='rose'?'selected':''}" style="background:#d79ab0" title="Розовая дымка" onclick="setTheme('rose')"></button></div></div><div class="settingrow"><div><strong>Прозрачность карточек</strong><small>Эффект стекла</small></div><div style="display:flex;align-items:center;gap:8px"><input type="range" min="35" max="100" value="${s.opacity}" oninput="setOpacity(this.value)"><span id="opacityValue">${s.opacity}%</span></div></div><div class="settingrow"><div><strong>Анимации интерфейса</strong><small>Плавное открытие вкладок</small></div><label><input type="checkbox" id="animations" ${s.animations!==false?'checked':''} onchange="data.settings.animations=this.checked;save();showToast('Настройки анимации обновлены')"></label></div></section><section class="card"><div class="cardhead"><h3>Фон сайта</h3><span>✧</span></div><p class="muted" style="font-size:12px">Загрузи собственную фотографию. Она сохранится в этом браузере и будет видна за полупрозрачными карточками.</p><div class="field"><label>Моя фотография</label><input id="customBackgroundFile" type="file" accept="image/*" onchange="setCustomBackground(this)"></div><button class="ghost" type="button" onclick="clearCustomBackground()">Убрать фото и вернуть фон темы</button></section><section class="card"><div class="cardhead"><h3>Мой кабинет</h3><span>♡</span></div><div class="field"><label>Название студии / подпись</label><input id="teacherName" value="${esc(s.teacher||'')}"></div><div class="field"><label>Валюта</label><select id="currency"><option value="RUB" ${s.currency==='RUB'?'selected':''}>Российский рубль (₽)</option><option value="EUR" ${s.currency==='EUR'?'selected':''}>Евро (€)</option><option value="USD" ${s.currency==='USD'?'selected':''}>Доллар ($)</option></select></div></section><section class="card"><div class="cardhead"><h3>Данные и приватность</h3><span>⌂</span></div><p class="muted">Все данные сохраняются локально в браузере на этом устройстве. Это демоверсия без аккаунтов, облачной синхронизации и резервного копирования.</p><button class="ghost" onclick="exportData()">Экспортировать резервную копию</button><button class="ghost" style="margin-left:6px" onclick="document.getElementById('importFile').click()">Импортировать</button><input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(this)"><button class="ghost" style="display:block;margin-top:12px;color:#b66a7b" onclick="resetData()">Сбросить все данные</button></section></div>`}
function setTheme(theme){data.settings.theme=theme;save();applySettings();render()}function setCustomBackground(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('Выбери файл изображения');return}if(file.size>4*1024*1024){showToast('Изображение должно быть меньше 4 МБ');return}const reader=new FileReader();reader.onload=()=>{data.settings.customBackground=reader.result;save();applySettings();showToast('Фон обновлён ✿')};reader.readAsDataURL(file)}function clearCustomBackground(){delete data.settings.customBackground;save();applySettings();render();showToast('Возвращён фон выбранной темы')}function setOpacity(v){data.settings.opacity=Number(v);$('#opacityValue').textContent=v+'%';applySettings()}function applySettings(){const s=data.settings;const brandName=document.getElementById('studioBrandName');if(brandName)brandName.textContent=(s.teacher||'Bloom English').trim()||'Bloom English';document.body.dataset.theme=s.theme||'pink';if(s.customBackground){document.body.classList.add('has-custom-bg');document.body.style.setProperty('--custom-bg',`url(\"${s.customBackground}\")`)}else{document.body.classList.remove('has-custom-bg');document.body.style.removeProperty('--custom-bg')}document.documentElement.style.setProperty('--panel',s.theme==='night'?`rgba(54,50,64,${s.opacity/100})`:`rgba(255,255,255,${s.opacity/100})`);if(s.animations===false){document.querySelectorAll('.page,.modalback,.modal').forEach(el=>el.style.animation='none')}else{document.querySelectorAll('.page,.modalback,.modal').forEach(el=>el.style.animation='')}}function saveSettings(){const workStart=Number($('#workStart').value),workEnd=Number($('#workEnd').value);if(workEnd<=workStart){showToast('Время окончания должно быть позже начала');return}data.settings.workStart=workStart;data.settings.workEnd=workEnd;data.settings.priceIndividual=Math.max(0,Number($('#priceIndividual').value)||0);data.settings.pricePair=Math.max(0,Number($('#pricePair').value)||0);data.settings.teacher=$('#teacherName').value.trim()||'Моя студия английского';data.settings.currency=$('#currency').value;save();showToast('Настройки сохранены ✿');render()}
function modal(title,body,submitText,submitFn){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><form id="modalForm">${body}<div class="formactions"><button type="button" class="ghost" onclick="closeModal()">Отмена</button><button class="primary" type="submit">${submitText}</button></div></form></div></div>`;$('#modalForm').onsubmit=e=>{e.preventDefault();submitFn(new FormData(e.target))}}
function themedConfirm(message,title='Подтверди действие',dangerText='Да, продолжить'){return new Promise(resolve=>{$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)finishThemedConfirm(false)"><div class="confirmbox" role="dialog" aria-modal="true"><div class="confirmflower">🌷</div><h3>${title}</h3><p>${esc(message)}</p><div class="confirmactions"><button type="button" class="ghost" onclick="finishThemedConfirm(false)">Отмена</button><button type="button" class="danger" onclick="finishThemedConfirm(true)">${dangerText}</button></div></div></div>`;window._bloomConfirmResolve=resolve})}function finishThemedConfirm(answer){$('#modalRoot').innerHTML='';if(window._bloomConfirmResolve){window._bloomConfirmResolve(answer);window._bloomConfirmResolve=null}}function closeModal(){$('#modalRoot').innerHTML=''}function openStudentModal(id){const s=id?student(id):null;modal(s?'Редактировать студента':'Новый студент',`<div class="field"><label>Имя студента или название пары *</label><input name="name" required value="${esc(s?.name||'')}" placeholder="Например, Алиса Морозова"></div><div class="field"><label>Уровень английского</label><select name="level"><option ${s?.level==='A1 · Beginner'?'selected':''}>A1 · Beginner</option><option ${s?.level==='A2 · Elementary'?'selected':''}>A2 · Elementary</option><option ${s?.level==='B1 · Intermediate'?'selected':''}>B1 · Intermediate</option><option ${s?.level==='B2 · Upper-intermediate'?'selected':''}>B2 · Upper-intermediate</option><option ${s?.level==='C1 · Advanced'?'selected':''}>C1 · Advanced</option><option ${!s?.level?'selected':''}>Не указан</option></select></div><div class="field"><label>Формат занятий</label><select name="type"><option value="individual" ${s?.type!=='pair'?'selected':''}>Индивидуальное</option><option value="pair" ${s?.type==='pair'?'selected':''}>Парное</option></select></div><div class="field"><label>Цена за занятие (₽)</label><input name="price" type="number" min="0" step="50" value="${s?.price??data.settings.priceIndividual}" required></div><div class="field"><label>Контакт / заметка</label><input name="contact" value="${esc(s?.contact||'')}" placeholder="Необязательно"></div><div class="field"><label><input name="active" type="checkbox" ${s?.active!==false?'checked':''}> Активный студент</label></div>${s?`<button type="button" class="ghost" style="color:#b66a7b" onclick="deleteStudent(${s.id})">Удалить студента</button>`:''}`,s?'Сохранить':'Добавить',f=>{const obj={name:f.get('name').trim(),level:f.get('level'),type:f.get('type'),price:Math.max(0,Number(f.get('price'))||0),contact:f.get('contact').trim(),active:f.has('active')};if(s)Object.assign(s,obj);else data.students.push({id:Date.now(),...obj});save();closeModal();render();showToast(s?'Карточка обновлена':'Студент добавлен ✿')})}
async function deleteStudent(id){if(!await themedConfirm('История занятий останется, но студент исчезнет из списка.','Удалить студента?','Удалить'))return;data.students=data.students.filter(s=>s.id!==id);save();closeModal();render();showToast('Студент удалён')}
function openLessonModal(id=null,date=iso(calDate),time='10:00'){const l=id?data.lessons.find(x=>x.id===id):null;const opts=data.students.map(s=>`<option value="${s.id}" ${l?.studentId===s.id?'selected':''}>${esc(s.name)} · ${typeName(s.type)}</option>`).join('');modal(l?'Редактировать занятие':'Новое занятие',`${!data.students.length?'<p class="muted">Сначала добавь студента во вкладке «Студенты».</p>':''}<div class="field"><label>Студент / пара *</label><select name="studentId" required>${opts}</select></div><div class="grid2"><div class="field"><label>Дата *</label><input name="date" type="text" readonly class="bloom-picker-input" required value="${l?.date||date}" onclick="openBloomPicker(this,'date')" aria-label="Выбрать дату"></div><div class="field"><label>Время *</label><input name="time" type="text" readonly class="bloom-picker-input" required value="${l?.time||time}" onclick="openBloomPicker(this,'time')" aria-label="Выбрать время"></div></div><div class="grid2"><div class="field"><label>Длительность</label><select name="duration">${Array.from({length:18},(_,i)=>(i+1)*10).map(n=>`<option value="${n}" ${(Number(l?.duration||60)===n)?'selected':''}>${n} минут</option>`).join('')}</select></div><div class="field"><label>Формат</label><select name="type"><option value="individual" ${l?.type!=='pair'?'selected':''}>Индивидуальное</option><option value="pair" ${l?.type==='pair'?'selected':''}>Парное</option></select></div></div><div class="field"><label>Статус</label><select name="status"><option value="planned" ${!l||l.status==='planned'?'selected':''}>Запланировано</option><option value="done" ${l?.status==='done'?'selected':''}>Проведено</option><option value="cancelled" ${l?.status==='cancelled'?'selected':''}>Отменено</option></select></div><div class="field"><label>Повторять занятие каждую неделю</label><select name="repeatWeeks"><option value="1">Не повторять</option><option value="2">На 2 недели (включая эту)</option><option value="3">На 3 недели (включая эту)</option><option value="4">На 4 недели (включая эту)</option><option value="5">На 5 недель (включая эту)</option><option value="6">На 6 недель (включая эту)</option><option value="8">На 8 недель (включая эту)</option><option value="12">На 12 недель (включая эту)</option><option value="16">На 16 недель (включая эту)</option></select><small class="muted">При редактировании создаст дополнительные занятия по этому шаблону.</small></div><div class="field"><label>Заметка</label><textarea name="note" rows="2" placeholder="Домашнее задание, тема урока…">${esc(l?.note||'')}</textarea></div>${l?`<button type="button" class="ghost" style="color:#b66a7b" onclick="deleteLesson(${l.id})">Удалить занятие</button>`:''}`,l?'Сохранить':'Добавить занятие',f=>{const obj={studentId:Number(f.get('studentId')),date:f.get('date'),time:f.get('time'),duration:Number(f.get('duration')),type:f.get('type'),status:f.get('status'),note:f.get('note')};if(!obj.studentId){showToast('Сначала добавь студента');return}const repeat=Math.max(1,Number(f.get('repeatWeeks')||1));if(l)Object.assign(l,obj);else data.lessons.push({id:Date.now(),...obj});let added=0;if(repeat>1){for(let w=1;w<repeat;w++){const d=parseDate(obj.date);d.setDate(d.getDate()+7*w);const nextDate=iso(d);const exists=data.lessons.some(x=>Number(x.studentId)===obj.studentId&&x.date===nextDate&&x.time===obj.time&&x.status!=='cancelled');if(!exists){data.lessons.push({id:Date.now()+w,...obj,date:nextDate,status:'planned'});added++}}}save();closeModal();render();showToast(l?`Занятие обновлено${added?`, добавлено повторов: ${added}`:''}`:`Занятие добавлено${added?`, повторов: ${added}`:' ✿'}`)})}
async function deleteLesson(id){if(!await themedConfirm('Это занятие будет удалено из расписания.','Удалить занятие?','Удалить'))return;data.lessons=data.lessons.filter(l=>l.id!==id);save();closeModal();render();showToast('Занятие удалено')}
function openPaymentModal(lessonId){const eligible=data.lessons.filter(l=>l.status!=='cancelled');const chosen=eligible.find(l=>l.id===lessonId);modal('Записать оплату',`<div class="field"><label>Занятие *</label><select name="lessonId" id="paymentLesson" required onchange="updatePaymentHint()">${eligible.map(l=>`<option value="${l.id}" ${chosen?.id===l.id?'selected':''}>${esc(l.date)} · ${esc(l.time)} · ${esc(lessonStudent(l))} (${money(pendingAmount(l))} осталось)</option>`).join('')}</select></div><div class="field"><label>Сумма оплаты (₽) *</label><input name="amount" type="number" min="1" step="1" required value="${chosen?pendingAmount(chosen):''}" placeholder="Например, 1800"></div><div class="field"><label>Дата оплаты</label><input name="date" type="text" readonly class="bloom-picker-input" value="${iso(today)}" required onclick="openBloomPicker(this,'date')" aria-label="Выбрать дату оплаты"></div><div class="field"><label>Комментарий</label><input name="note" placeholder="Например, абонемент / перевод"></div><p class="muted" style="font-size:12px">Можно записывать частичные оплаты. Каждая запись сохраняется в истории.</p>`,'Сохранить оплату',f=>{const l=data.lessons.find(x=>x.id===Number(f.get('lessonId')));if(!l){showToast('Сначала добавь занятие');return}const amount=Number(f.get('amount'));if(amount<=0){showToast('Укажи сумму больше нуля');return}data.payments.push({id:Date.now(),lessonId:l.id,amount,date:f.get('date'),note:f.get('note')});save();closeModal();render();showToast('Оплата сохранена ✿')})}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bloom-english-backup.json';a.click();URL.revokeObjectURL(url);showToast('Резервная копия подготовлена')}function importData(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.students)||!Array.isArray(x.lessons))throw Error();data=x;data.settings={...defaults.settings,...data.settings};data.payments||=[];save();render();showToast('Данные импортированы')}catch{showToast('Не удалось прочитать файл')}};r.readAsText(file)}async function resetData(){if(!await themedConfirm('Все студенты, занятия и оплаты будут удалены. Это действие нельзя отменить.','Сбросить данные?','Сбросить всё'))return;data=structuredClone(defaults);save();render();showToast('Данные сброшены')}
render();

let bloomPickerState=null;function openBloomPicker(input,kind){const existing=document.getElementById('bloomPickerRoot');if(existing)existing.remove();const current=input.value||(kind==='date'?iso(new Date()):'10:00');bloomPickerState={input,kind,value:current,month:new Date((current.match(/^\d{4}-\d{2}-\d{2}$/)?current:iso(new Date()))+'T12:00:00')};drawBloomPicker()}function drawBloomPicker(){const st=bloomPickerState;if(!st)return;document.querySelectorAll('#bloomPickerRoot').forEach(n=>n.remove());const root=document.createElement('div');root.id='bloomPickerRoot';root.className='picker-back';root.onclick=e=>{if(e.target===root)closeBloomPicker()};let inner='';if(st.kind==='date'){const y=st.month.getFullYear(),m=st.month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();inner=`<div class="picker-top"><h3 class="picker-title">Выбери дату</h3><div class="picker-nav"><button type="button" aria-label="Предыдущий месяц" onclick="moveBloomMonth(-1)">‹</button><button type="button" aria-label="Следующий месяц" onclick="moveBloomMonth(1)">›</button></div></div><div class="picker-month">${new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(st.month)}</div><div class="picker-week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<span>${x}</span>`).join('')}</div><div class="picker-days">`;for(let i=0;i<42;i++){let n=i-offset+1,dt,dim=false;if(n<1){dt=new Date(y,m-1,prev+n);dim=true}else if(n>days){dt=new Date(y,m+1,n-days);dim=true}else dt=new Date(y,m,n);const val=iso(dt);inner+=`<button type="button" class="picker-day ${dim?'dim':''} ${val===st.value?'selected':''}" onclick="chooseBloomDate('${val}')">${dt.getDate()}</button>`}inner+='</div>'}else{inner=`<div class="picker-top"><h3 class="picker-title">Выбери время</h3><span class="muted" style="font-size:12px">Прокручивай или используй ↑ ↓</span></div><div class="picker-timewheel" id="pickerTimeWheel" tabindex="0" role="listbox" aria-label="Выбор времени">`;for(let h=0;h<24;h++)for(let m=0;m<60;m+=10){const v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');inner+=`<button type="button" role="option" aria-selected="${v===st.value}" class="picker-time ${v===st.value?'selected':''}" data-time="${v}" onclick="highlightBloomTime('${v}')">${v}</button>`}inner+='</div><div class="picker-time-current" id="pickerTimeCurrent">Выбрано: '+st.value+'</div>'}inner+=`<div class="picker-foot"><button type="button" class="ghost" onclick="closeBloomPicker()">Отмена</button>${st.kind==='time'?'<button type="button" class="primary" onclick="chooseBloomTime(bloomPickerState.value)">Выбрать время</button>':''}</div>`;root.innerHTML=`<div class="picker-card" role="dialog" aria-modal="true">${inner}</div>`;document.body.appendChild(root);if(st.kind==='time'){const wheel=root.querySelector('#pickerTimeWheel');const selected=wheel.querySelector('.picker-time.selected');if(selected)wheel.scrollTop=selected.offsetTop-wheel.clientHeight/2+selected.clientHeight/2;wheel.addEventListener('wheel',e=>{e.preventDefault();stepBloomTime(e.deltaY>0?1:-1)},{passive:false});wheel.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();stepBloomTime(1)}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();stepBloomTime(-1)}else if(e.key==='Enter'){e.preventDefault();chooseBloomTime(st.value)}else if(e.key==='Escape'){e.preventDefault();closeBloomPicker()}});wheel.focus({preventScroll:true})}}function moveBloomMonth(d){if(!bloomPickerState)return;bloomPickerState.month.setMonth(bloomPickerState.month.getMonth()+d);drawBloomPicker()}function highlightBloomTime(v){const st=bloomPickerState;if(!st)return;st.value=v;document.querySelectorAll('#pickerTimeWheel .picker-time').forEach(b=>{const on=b.dataset.time===v;b.classList.toggle('selected',on);b.setAttribute('aria-selected',String(on));if(on)b.scrollIntoView({block:'center',behavior:'smooth'})});const label=document.getElementById('pickerTimeCurrent');if(label)label.textContent='Выбрано: '+v}function stepBloomTime(delta){const st=bloomPickerState;if(!st)return;let mins=Number(st.value.slice(0,2))*60+Number(st.value.slice(3));mins=(mins+delta*10+1440)%1440;highlightBloomTime(String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'))}function closeBloomPicker(){document.getElementById('bloomPickerRoot')?.remove();bloomPickerState=null}function chooseBloomDate(v){const st=bloomPickerState;if(!st)return;st.input.value=v;st.input.dispatchEvent(new Event('change',{bubbles:true}));closeBloomPicker()}function chooseBloomTime(v){const st=bloomPickerState;if(!st)return;st.input.value=v;st.input.dispatchEvent(new Event('change',{bubbles:true}));closeBloomPicker()}
</script></body></html>
